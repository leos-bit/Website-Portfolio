  <text x="190" y="316" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Service + operator logs</text>

  <rect x="342" y="210" width="236" height="132" rx="24" fill="#ffffff" stroke="#d7cec2" />
  <text x="460" y="254" text-anchor="middle" fill="#d75f2a" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Route + Extract</text>
  <text x="460" y="290" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Native PyMuPDF</text>
  <text x="460" y="316" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Surya / Nemotron OCR</text>

  <rect x="622" y="210" width="236" height="132" rx="24" fill="#ffffff" stroke="#d7cec2" />
  <text x="740" y="254" text-anchor="middle" fill="#0a7b6c" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Reconstruct</text>
