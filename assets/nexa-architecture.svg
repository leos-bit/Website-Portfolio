<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NEXA published repository architecture</title>
  <desc id="desc">Diagram showing manufacturing manuals and operator records routed through extraction into structured datasets, troubleshooting retrieval, and evaluation.</desc>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf6f3" />
      <stop offset="100%" stop-color="#fbefe9" />
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#f7f6f2" />
  <rect x="48" y="48" width="1104" height="664" rx="28" fill="url(#panel)" stroke="#e7e2da" stroke-width="3" />
  <text x="82" y="108" fill="#1c1c1c" font-family="'Space Grotesk', sans-serif" font-size="40" font-weight="700">NEXA Manufacturing Data Pipeline</text>
  <text x="82" y="146" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="22">Published repository flow from source records to traceable troubleshooting data.</text>

  <rect x="82" y="210" width="216" height="132" rx="24" fill="#ffffff" stroke="#d7cec2" />
  <text x="190" y="254" text-anchor="middle" fill="#0a7b6c" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Source Records</text>
