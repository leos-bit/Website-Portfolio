  <text x="927" y="482" text-anchor="middle" fill="#0a7b6c" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Evaluation</text>
  <text x="927" y="518" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Coverage + throughput</text>
  <text x="927" y="544" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Regression scorecards</text>
  <text x="927" y="570" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Human review manifests</text>

  <path d="M1010 350 V394 H273 V428" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M1010 394 H600 V428" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M1010 394 H927 V428" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M261 418 L273 438 L285 418" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M588 418 L600 438 L612 418" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M915 418 L927 438 L939 418" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <text x="84" y="666" fill="#1c1c1c" font-family="'Space Grotesk', sans-serif" font-size="21" font-weight="700">Current public system</text>
  <text x="84" y="696" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Source-aware extraction, traceable data contracts, troubleshooting retrieval, and quality-gated handwritten OCR.</text>
