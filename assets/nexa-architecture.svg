  <text x="273" y="570" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Evidence-backed cases</text>

  <rect x="465" y="438" width="270" height="154" rx="24" fill="#ffffff" stroke="#d7cec2" />
  <text x="600" y="482" text-anchor="middle" fill="#d75f2a" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Dataset Assembly</text>
  <text x="600" y="518" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Semantic chunks</text>
  <text x="600" y="544" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Dedup + review actions</text>
  <text x="600" y="570" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Training-ready exports</text>

