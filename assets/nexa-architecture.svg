  <text x="740" y="316" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Form-aware handwriting</text>

  <rect x="902" y="210" width="216" height="132" rx="24" fill="#ffffff" stroke="#d7cec2" />
  <text x="1010" y="254" text-anchor="middle" fill="#d75f2a" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Structured Data</text>
  <text x="1010" y="290" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">JSONL + Parquet</text>
  <text x="1010" y="316" text-anchor="middle" fill="#4f4f4f" font-family="'Space Grotesk', sans-serif" font-size="18">Provenance + QA metadata</text>

